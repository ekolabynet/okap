<title>Okap Teren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Układ: widok 2,5D (aksonometria lub mapa) z paskiem narzędzi, obok panel warstw; pod spodem przekrój i zakładki (wskaźniki, drzewo, dane, eksperymenty, parametry, zasady). */
:root{
  --bg:#EDEFEA; --surface:#F8F9F6; --surface-2:#E2E6DF; --ink:#1C2421; --ink-soft:#4C5A53; --line:#C8CFC6;
  --accent:#A0522D; --accent-ink:#FBF6F2; --sky-top:#D9E4EA; --sky-bot:#F2F4F0; --grid:rgba(28,36,33,.10);
  --bld:#8D959B; --bld-top:#B4BBC0; --crit:#B83B27; --warn:#C27B12; --good:#3A8048; --info:#2A6A8C;
  --trunk:#6B5E52; --dead:#9C8A73; --road:#5B6166;
  --t-zw:#4E7A53; --t-zs:#A78C4B; --t-uw:#5A8790; --t-us:#CBB688;
  --s-trawnik:#7FA85A; --s-sciolka:#8A6A4A; --s-chodnik:#A9ADB0; --s-laka:#B8B45A; --s-zadrz:#5D7A3A; --s-rabata:#C98AA8; --s-klomb:#E0A04A; --s-grad:#3F6B3A; --s-leg:#4E7F6A; --s-ekoton:#8A9A4E;
  --w1:#2A6A8C; --w2:#C2531F; --w3:#3D8A4A; --w4:#7B4FA6; --w5:#A87A1E; --w6:#4D5A55;
  --card:#FFFFFF; --shadow:0 1px 0 rgba(28,36,33,.06),0 6px 18px rgba(28,36,33,.08);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201C; --surface-2:#212A26; --ink:#E3EAE5; --ink-soft:#A3B1A9; --line:#34413B;
  --accent:#E08C5A; --accent-ink:#1A0F09; --sky-top:#18252D; --sky-bot:#121815; --grid:rgba(227,234,229,.09);
  --bld:#59626A; --bld-top:#7A848B; --crit:#E86A52; --warn:#E6A23A; --good:#6DBE7C; --info:#73B6D8;
  --trunk:#8C7E70; --dead:#7A6B58; --road:#3E4348;
  --t-zw:#3B6141; --t-zs:#7D6A38; --t-uw:#416A73; --t-us:#8C7C57;
  --s-trawnik:#5C8240; --s-sciolka:#6B5139; --s-chodnik:#6F7477; --s-laka:#8C893F; --s-zadrz:#46602C; --s-rabata:#9A6680; --s-klomb:#B07A2E; --s-grad:#2F5230; --s-leg:#3A6252; --s-ekoton:#6B7A38;
  --w1:#73B6D8; --w2:#F08A5D; --w3:#7CCB86; --w4:#B795E0; --w5:#E6B85A; --w6:#AAB7B0;
  --card:#1D2621; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201C; --surface-2:#212A26; --ink:#E3EAE5; --ink-soft:#A3B1A9; --line:#34413B;
  --accent:#E08C5A; --accent-ink:#1A0F09; --sky-top:#18252D; --sky-bot:#121815; --grid:rgba(227,234,229,.09);
  --bld:#59626A; --bld-top:#7A848B; --crit:#E86A52; --warn:#E6A23A; --good:#6DBE7C; --info:#73B6D8;
  --trunk:#8C7E70; --dead:#7A6B58; --road:#3E4348;
  --t-zw:#3B6141; --t-zs:#7D6A38; --t-uw:#416A73; --t-us:#8C7C57;
  --s-trawnik:#5C8240; --s-sciolka:#6B5139; --s-chodnik:#6F7477; --s-laka:#8C893F; --s-zadrz:#46602C; --s-rabata:#9A6680; --s-klomb:#B07A2E; --s-grad:#2F5230; --s-leg:#3A6252; --s-ekoton:#6B7A38;
  --w1:#73B6D8; --w2:#F08A5D; --w3:#7CCB86; --w4:#B795E0; --w5:#E6B85A; --w6:#AAB7B0;
  --card:#1D2621; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1360px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;letter-spacing:.2px}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);background:var(--surface)}
.terrname{color:var(--ink-soft);font-size:13px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;min-height:34px;white-space:nowrap}
.btn:hover{border-color:var(--ink-soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:3px 8px;min-height:28px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;min-height:32px}
.seg button.on{background:var(--ink);color:var(--bg)}
label.inl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
input[type=number],input[type=text],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px}
input[type=number]{width:76px}
textarea{width:100%;font-family:var(--f-mono);font-size:12.5px;min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:12px;align-items:start}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.viewbar,.toolbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.toolbar{border-bottom:0;border-top:1px solid var(--line)}
.toolbar .seg{flex-wrap:wrap}
.viewbox{position:relative;height:min(62vh,600px);min-height:340px;touch-action:none;cursor:grab}
.viewbox.pick{cursor:crosshair}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;pointer-events:none;max-width:70%}
.hud b{font-family:var(--f-display);font-weight:400;font-size:16px}
.legend{position:absolute;right:10px;bottom:10px;background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;max-width:min(60%,300px);pointer-events:none}
.legend .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px}.legend .lgrid span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend .ramp{height:8px;border-radius:4px;margin:4px 0 2px;min-width:160px}
.legend .rl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--ink-soft)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 7px;border-radius:6px;white-space:nowrap;display:none;z-index:3}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.box h3{font-family:var(--f-display);font-weight:400;font-size:16px;margin:0 0 6px}
.box h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:10px 0 4px}
.lyr{display:flex;align-items:center;gap:7px;font-size:14px;padding:2px 0;cursor:pointer}
.lyr input{margin:0;accent-color:var(--accent)}
.lyr .u{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-soft)}
.note{font-size:13px;color:var(--ink-soft)}
.secp{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.secp .bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.secp .bar b{font-family:var(--f-display);font-weight:400;font-size:16px;margin-right:auto}
.secbox{position:relative;height:340px}
#secCv{position:absolute;inset:0;width:100%;height:100%}
.tabs{margin-top:12px}
.tabbar{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabbar button{border:0;background:transparent;padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;color:var(--ink-soft)}
.tabbar button.on{color:var(--ink);border-bottom-color:var(--accent)}
.panel{display:none;padding:12px 0}
.panel.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.card .k{font-size:12px;color:var(--ink-soft)}
.card .v{font-family:var(--f-display);font-size:22px;line-height:1.2}
.card .s{font-size:12px;color:var(--ink-soft)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.chart .t{font-size:13px;font-weight:700;margin-bottom:2px}
.chart canvas{width:100%;height:150px;display:block}
.chart.big canvas{height:260px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--ink-soft);font-size:12px}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--ink-soft)}
.kv span:nth-child(even){font-family:var(--f-mono);font-size:12.5px}
.msg{font-size:13px;border-left:3px solid var(--info);padding:4px 8px;background:var(--card);margin:6px 0;border-radius:0 6px 6px 0}
.msg.warn{border-color:var(--warn)}.msg.err{border-color:var(--crit)}.msg.ok{border-color:var(--good)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;flex:1;min-width:120px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 14px}
.pgrid label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;padding:2px 0;border-bottom:1px dashed var(--line)}
.pgrid label.chg{color:var(--accent)}
.pgrid input{width:84px}
.doc{max-width:760px;font-size:14.5px}
.doc h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:16px 0 6px}
.doc code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.doc li{margin:3px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.mono{font-family:var(--f-mono);font-size:12.5px}
details summary{cursor:pointer;color:var(--ink-soft);font-size:13px}
@media (max-width:900px){.grid{grid-template-columns:1fr}.viewbox{height:56vh;min-height:300px}.brand h1{font-size:22px}}
@media (max-width:520px){.app{padding-top:8px}.btn{padding:5px 9px}.secbox{height:280px}.hide-s{display:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Okap Teren</h1><span class="chip" id="verChip"></span><span class="terrname" id="terrName"></span></div>
    <div class="ctrl">
      <button class="btn pri" id="bPlay">▶ Graj</button>
      <button class="btn" id="bSeason" title="Jedna pora roku">+ pora</button>
      <button class="btn" id="bYear" title="Cały rok">+ rok</button>
      <label class="inl">ziarno <input type="number" id="seed" value="7" min="1" style="width:64px"></label>
      <button class="btn" id="bReset" title="Zacznij od nowa na tym terenie">Od nowa</button>
    </div>
  </header>

  <div class="grid">
    <section class="stage">
      <div class="viewbar">
        <div class="seg" id="modeSeg"><button data-m="axo" class="on">Aksonometria</button><button data-m="vox">Woksele</button><button data-m="map">Mapa</button></div>
        <button class="btn sm" id="rotL" title="Obróć w lewo">⟲</button><button class="btn sm" id="rotR" title="Obróć w prawo">⟳</button>
        <label class="inl hide-s">nachylenie <input type="range" id="tilt" min="20" max="75" value="38"></label>
        <label class="inl">przewyższenie <select id="exag"><option>1</option><option selected>1.5</option><option>2</option><option>3</option><option>5</option></select></label>
        <button class="btn sm" id="zIn">+</button><button class="btn sm" id="zOut">−</button><button class="btn sm" id="zFit">Dopasuj</button>
      </div>
      <div class="viewbox" id="vbox"><canvas id="gl" style="position:absolute;inset:0;width:100%;height:100%;display:none"></canvas><canvas id="cv"></canvas><div class="hud" id="hud"></div><div class="legend" id="legend"></div><div class="tip" id="tip"></div></div>
      <div class="toolbar" id="tools">
        <div class="seg" id="toolSeg">
          <button data-t="pick" class="on">Wskaż</button><button data-t="section">Przekrój</button><button data-t="plant">Sadź</button><button data-t="cut">Wytnij</button><button data-t="prune">Przytnij</button><button data-t="brush">Pędzel</button>
        </div>
        <span id="toolOpts" class="row" style="margin:0"></span>
        <span class="note" id="toolHint"></span>
      </div>
    </section>

    <aside class="side">
      <div class="box">
        <h3>Warstwa podłoża</h3>
        <div id="lyrGround"></div>
        <h4>Komponenty</h4>
        <div id="lyrComp"></div>
        <h4>Obiekty punktowe</h4>
        <div class="row" style="margin:2px 0"><select id="ptSet" style="width:100%;min-width:0"></select></div>
        <div class="seg" id="ptMode"><button data-p="off" class="on">Ukryj</button><button data-p="swarm">Rój</button><button data-p="heat">Mapa ciepła</button></div>
      </div>
    </aside>
  </div>

  <section class="secp" id="secPanel" hidden>
    <div class="bar">
      <b id="secTitle">Przekrój</b>
      <div class="seg" id="secSeg"><button data-s="prof" class="on">Profil 1,5D</button><button data-s="vert">Pionowy 2D</button><button data-s="horz">Poziomy 2D</button></div>
      <label class="inl" id="secBandL">pas ± <input type="number" id="secBand" value="4" min="0.5" max="30" step="0.5"> m</label>
      <label class="inl" id="secZL">wysokość <input type="range" id="secZ" min="0.3" max="30" step="0.1" value="1.6"> <span class="mono" id="secZv">1,6 m</span></label>
      <button class="btn sm" id="secCsv">CSV</button>
      <button class="btn sm" id="secClose">Zamknij</button>
    </div>
    <div class="secbox"><canvas id="secCv"></canvas></div>
  </section>

  <section class="tabs">
    <nav class="tabbar" id="tabbar">
      <button data-p="ind" class="on">Wskaźniki</button><button data-p="tree">Drzewo</button><button data-p="data">Dane</button><button data-p="exp">Eksperymenty</button><button data-p="par">Parametry</button><button data-p="rules">Zasady</button>
    </nav>
    <div class="panel on" id="p-ind"><div class="cards" id="cards"></div><div class="charts" id="charts"></div></div>
    <div class="panel" id="p-tree"><div id="treeCard" class="note">Kliknij drzewo na widoku (narzędzie „Wskaż”).</div></div>
    <div class="panel" id="p-data"></div>
    <div class="panel" id="p-exp"></div>
    <div class="panel" id="p-par"></div>
    <div class="panel" id="p-rules"><div class="doc" id="rulesDoc"></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script id="engine">
'use strict';
/* ================= Okap Teren · silnik (bez DOM: strona, workery, node) ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const deep=o=>JSON.parse(JSON.stringify(o));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function randn(r){let u=0,v=0;while(u===0)u=r();while(v===0)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const getK=(o,k)=>k.split('.').reduce((a,b)=>a==null?a:a[b],o);
const setK=(o,k,v)=>{const p=k.split('.');let a=o;for(let i=0;i<p.length-1;i++){if(a[p[i]]==null||typeof a[p[i]]!=='object')a[p[i]]={};a=a[p[i]];}a[p[p.length-1]]=v;};
const HAB={zw:{name:'żyzne, wilgotne',short:'ŻW',prod:1.1,moist:1.0,nut:1.1},zs:{name:'żyzne, suche',short:'ŻS',prod:1.0,moist:0.72,nut:1.0},uw:{name:'ubogie, wilgotne',short:'UW',prod:0.85,moist:0.95,nut:0.85},us:{name:'ubogie, suche',short:'US',prod:0.75,moist:0.6,nut:0.75}};
// nawierzchnia i runo (typy fizjonomiczne): seal uszczelnienie, mow koszenie, mulch ściółka, seed miejsce dla siewek, compW/compN konkurencja runa o wodę i azot,
// irrig podlewanie, dig przekopywanie, weed pielenie, nect pożytek dla zapylaczy, bioV wartość przyrodnicza, rbh nakład na 2 m pasa rocznie, light światło potrzebne runu,
// tall zacienianie siewek przez wysokie runo, inoc inokulum symbiontów w glebie (ecm, am, b = bakterie)
const SURF={
  trawnik:{name:'trawnik gazonowy, koszony',seal:0.1,mow:1,mulch:0,seed:false,compW:0.25,compN:0.15,irrig:0,dig:0,weed:0,nect:0.05,bioV:0.05,rbh:0.4,light:0.4,tall:0,inoc:{ecm:0.1,am:0.5,b:0.2}},
  laka:{name:'łąka kwietna, koszona 1–2 razy',seal:0,mow:0.15,mulch:0,seed:true,compW:0.3,compN:0.2,irrig:0,dig:0,weed:0,nect:0.7,bioV:0.5,rbh:0.1,light:0.5,tall:0.5,inoc:{ecm:0.15,am:0.6,b:0.3}},

// zgnilizna twardzieli: wejście przez rany, rozkład obniża D_eff (pozostałe gildie grzybów w wersji 4.1)

function storms(si){const ev=S.event;const windy=ev.type==='wind'||ev.type==='storm'||ev.type==='gale';const wetF=(ev.type==='wet'||ev.type==='thaw')?0.8:1;LEAFF=LEAF_F[si];const rng=S.rng;

/* ================= zarządzanie ================= */

  for(const [k,cnt] of S.bank){const i=Math.floor(k/nsp),sp=k-i*nsp;if(born.get(i)||S.trees.length>=W.maxTrees)continue;const sk=surfKey(T,i),surf=SURF[sk];if(T.bld[i]>0)continue;
    const pr=protAt(S,i);const site=surf.seed?1:(surf.seal<0.5?pr:0);if(site<=0)continue;const s=S.SP[sp];const gl=S.ground[i]*(1-0.7*surf.tall*S.vig[i]);const lf=gl>=s.lightReq?1:Math.pow(gl/Math.max(s.lightReq,0.01),2);
    if(rng()<1-Math.pow(1-W.estab*site*lf*(s.hab[habKey(T,i)]||1),cnt)){const [cx,cy]=cellXY(T,i);const x=cx+(rng()-0.5)*T.res,y=cy+(rng()-0.5)*T.res;if(nearCount(x,y,0.6)>=3)continue;
      const nt=newTree(sp,x,y,1,0.5,0.5,{origin:'samosiew',mother:S.bankM.get(k)||null});nt.RC=0.02;nt.Wc=0.4;crownsOne(nt);nt.FR=0.3;S.recY.seed++;S.cum.seed++;nt.init={y:S.year0+S.year,H:0.5,D:0.5,cf:1,cls:1};S.trees.push(nt);born.set(i,1);}}
  S.bank.clear();S.bankM.clear();}

/* ================= runo i gleba ================= */
function runoVigor(si){const T=S.T;const dry=S.event.type==='drought';for(let i=0;i<T.n;i++){const sf=SURF[surfKey(T,i)];let tg=sf.light>0?clamp(S.ground[i]/sf.light,0,1):1;if(dry)tg*=1-0.35*(1-Math.min(1,sf.irrig*S.W.irrBeds));S.vig[i]=clamp(S.vig[i]+0.4*(tg-S.vig[i]),0,1);}}
function runoDisturb(si){const rng=S.rng,T=S.T;for(const t of S.trees){if(!t.alive||t.dead||t.origin==='posadzone')continue;const sf=SURF[surfKey(T,t.ci)];
  if(t.H<1.5&&((sf.dig>0&&si!==1)||(sf.weed>0&&si===1&&rng()<sf.weed))){t.alive=false;t.cause='prace w runie';}}}
// nakład na runo w rbh na m² rocznie (koszenie, pielęgnacja rabat i klombów, dosiewanie łysiejącego trawnika)
function runoCare(){const W=S.W,T=S.T,o=S.ops;const a=T.res*T.res;for(let i=0;i<T.n;i++){const k=surfKey(T,i);const sf=SURF[k];if(sf.rbh<=0)continue;if(T.target[i]<W.minTarget&&sf.rbh<1)continue;let h=sf.rbh/20*a*W.runoRbh;if(k==='trawnik'&&S.vig[i]<0.5)h+=W.h_reseed/20*a;o.runo+=h;o.rbh+=h;}}
function soilYear(){const W=S.W,T=S.T,n=T.n;const fall=new Float32Array(n);
  for(const t of S.trees){if(t.dead||!t.alive)continue;const r=Math.max(t.Reff,T.res*0.5);const per=t.cf*t.leafOut*0.25;for(let dx=-r;dx<=r;dx+=T.res)for(let dy=-r;dy<=r;dy+=T.res){if(dx*dx+dy*dy>r*r)continue;const i=cellOf(T,t.x+dx,t.y+dy);if(i>=0)fall[i]+=per;}}
  for(let i=0;i<n;i++){const sf=SURF[surfKey(T,i)];let lit=S.lit[i]+fall[i]+0.3*sf.mulch;if(rakeCell(i))lit*=1-clamp(4*W.rakeLoss,0,0.9);if(sf.seal>0.5)lit*=0.2;if(sf.dig>0)lit*=0.5;
    const dec=lit*(1-Math.exp(-(0.3+0.9*S.fauna[i])));lit-=dec;S.lit[i]=clamp(lit,0,3);S.miner[i]=clamp(dec*1.5,0,1.5);
    const ft=clamp((0.3+0.7*Math.min(1,S.lit[i]+dec))*(0.5+0.5*moistI(i)+0.2*sf.irrig)*(1-0.9*sf.seal)*(1-0.5*Math.min(1,S.soilSalt[i]))*(1-0.4*S.comp[i])*(sf.dig?0.6:1),0,1);S.fauna[i]=clamp(S.fauna[i]+0.3*(ft-S.fauna[i]),0,1);
    S.comp[i]=clamp(S.comp[i]+(sf.seal<0.5&&!sf.dig?W.trample*T.target[i]*(1-0.5*sf.mulch):0)-0.25*(0.3+S.fauna[i])*S.comp[i]-(sf.dig?0.5*S.comp[i]:0),0,0.8);}}


/* ================= plastyczność koron i z* ================= */
// Promienie sektorów przesuwają się ku światłu i wolnej przestrzeni (fototropizm, unikanie cienia), a w głębokim cieniu sektor zamiera.
// Średnia szerokość korony nadal wynika z inwestycji w koronę; plastyczność zmienia jej rozkład i odejmuje zrzucone części.
function sectorFree(t,k){const T=S.T;const r=t.cr[k]+Math.max(T.res,1);const x=t.x+SEC_DX[k]*r,y=t.y+SEC_DY[k]*r;const i=cellOf(T,x,y);if(i<0)return 1;const z=zTop(t)-0.4*t.H*S.W.crownRatio;
  if(T.babs[i]>z)return 0.05;const j=voxJ(S,i,z);if(j<0||S.vx.mu[j]<=0)return 1;const o=S.vx.own[j];if(o===t.id&&S.vx.mu[j]-S.vx.muO[j]<1e-6)return 1;return S.vx.top[i]>=zTop(t)-0.5?0.3:0.75;}
function crownPlast(){const W=S.W;const kp=+W.crownPlast||0;if(kp<=0)return;const shed=W.shedL,amax=W.maxAsym;
  for(const t of S.trees){if(!t.alive||t.dead||t.H<1.5||!t.secL)continue;syncSec(t);const mean=t.Wc/2;if(mean<=0.2)continue;const w=new Float32Array(8);let wm=0;
    for(let k=0;k<8;k++){w[k]=(0.15+t.secL[k])*sectorFree(t,k);wm+=w[k];}wm/=8;if(wm<=0)continue;
    for(let k=0;k<8;k++){const tg=clamp(mean*Math.pow(w[k]/wm,0.5*kp),0.45*mean,amax*mean);t.cr[k]+=0.35*(tg-t.cr[k]);if(t.secL[k]<shed)t.cr[k]*=1-0.12*kp*(1-t.secL[k]/shed);if(t.cr[k]<0.15)t.cr[k]=0.15;}
    let m=0;for(let k=0;k<8;k++)m+=t.cr[k];t.Wc=2*m/8;}}
// z* według PPA: wysokość, przy której suma powierzchni koron drzew wyższych w kole o promieniu zR wypełnia koło (zwarcie okapu); brak = drzewostan otwarty
function ppaZ(x,y,bk,R,A0){const nb=bk.near(x,y,R).filter(o=>!o.dead&&o.alive&&o.H>=1.3&&(o.x-x)**2+(o.y-y)**2<=R*R).sort((a,b)=>b.H-a.H);let acc=0;for(const o of nb){acc+=Math.PI*o.Rp*o.Rp;if(acc>=A0)return o.H;}return NaN;}
function computeZstar(){const T=S.T,R=Math.max(3,+S.W.zR||15),A0=Math.PI*R*R;const bk=bucketTrees(S,R);for(const t of S.trees){if(!t.alive)continue;t.zs=t.dead?NaN:ppaZ(t.x,t.y,bk,R,A0);}
  const st=Math.max(1,Math.round(5/T.res));const Z=S.zstar||(S.zstar=new Float32Array(T.n));for(let r=0;r<T.ny;r+=st)for(let c=0;c<T.nx;c+=st){const [x,y]=cellXY(T,r*T.nx+c);const v=ppaZ(x+(st-1)*T.res/2,y-(st-1)*T.res/2,bk,R,A0);
    for(let a=0;a<st&&r+a<T.ny;a++)for(let b=0;b<st&&c+b<T.nx;b++)Z[(r+a)*T.nx+c+b]=v;}}
// profil pionowy okapu: gęstość ulistnienia (wskaźnik, tłumienie / 0,5) i pokrycie na kolejnych poziomach nad gruntem, na powierzchni bez budynków i jezdni
function vertProfile(mask){const T=S.T,X=S.vx;let nk=0;for(let i=0;i<T.n;i++)if(X.hi[i]+1>nk)nk=X.hi[i]+1;const lad=new Float64Array(nk),cov=new Float64Array(nk);let nc=0;
  for(let i=0;i<T.n;i++){if(mask?!mask[i]:(T.bld[i]>0||T.traffic[i]>0))continue;nc++;if(X.hi[i]<0)continue;for(let k=X.lo[i];k<=X.hi[i];k++){const m=X.mu[X.off[i]+k-X.lo[i]];if(m>0){lad[k]+=m/0.5;cov[k]++;}}}
  return {dz:X.dz,n:nc,lad:Array.from(lad,v=>nc?v/nc:0),cov:Array.from(cov,v=>nc?v/nc:0)};}
/* ================= bilans ================= */
function services(){const W=S.W,T=S.T;for(const t of S.trees){const s=IND(t);const i=t.ci;const leaf=Math.max(0,t.weq)*Math.max(0,t.cf);const water=1-t.ds;const te=S.no2[i];
    const co2=Math.max(0,(0.5*((t.D/100)**2*t.H-((t.D-t.dD)/100)**2*(t.H-t.dH))))*s.rho*1000*1.25*0.5*3.67;
    const bio=clamp(t.age/150,0,1)*0.5+clamp(t.D/80,0,1)*0.3+(t.dr>0.2?0.3:0)+0.3*s.native;
    const sv={shade:Math.PI*t.Reff*t.Reff*Math.max(0,t.cf),cool:leaf*water*(t.H>3?1:0.5),co2,rain:leaf*0.8,no2:leaf*(0.2+te)*(1-0.5*W.noxTox*(1-s.tolNOx)),bio};
    sv.tot=leaf*1+sv.cool*1.2+sv.co2*0.02+sv.rain*0.5+sv.no2*1.5+sv.bio*4;t.serv=sv;}}
function record(){const T=S.T;const n=S.trees.length;const cls=[0,0,0,0,0];let cfS=0,mlow=0,alow=0,wd=0,inf=0,dD=0,dH=0,nG=0,risk=0,nl=0;const serv={shade:0,cool:0,co2:0,rain:0,no2:0,bio:0,tot:0},def={l:0,w:0,n:0,x:0};
  for(const t of S.trees){cls[vclass(t)-1]++;cfS+=t.cf;if(t.H>=4){if(t.margin<1)mlow++;if(t.anch<1)alow++;}if(t.wound>0.03)wd++;if(t.inf)inf++;if(!t.dead&&t.H>1.5){dD+=t.dD;dH+=t.dH;nG++;def.l+=t.def.l;def.w+=t.def.w;def.n+=t.def.n;def.x+=t.def.x;nl++;}
    for(const k in serv)serv[k]+=t.serv[k]||0;risk+=t.risk;}
  let hdS=0,hdN=0;for(const t of S.trees){if(!t.dead&&t.H>=4&&t.D>3){hdS+=t.H/(t.D/100);hdN++;}}
  computeZstar();const zz=[];let nOpen=0,nB=0,hdB=0,nC=0,hdC=0,hdO=0,n4z=0;for(const t of S.trees){if(t.dead||t.H<4||t.D<=3)continue;n4z++;const hd=t.H/(t.D/100);
    if(!isFinite(t.zs)){nOpen++;hdO+=hd;continue;}zz.push(t.zs);if(t.H<t.zs&&t.zs-t.H<=3){nB++;hdB+=hd;}else if(t.H>=t.zs){nC++;hdC+=hd;}}
  zz.sort((a,b)=>a-b);const zsM=zz.length?zz[zz.length>>1]:null;const vp=vertProfile();let ladT=0;for(const v of vp.lad)ladT+=v*vp.dz;
  const n4=S.trees.filter(t=>t.H>=4).length||1;S.cum.rbh+=S.ops.rbh;S.cum.co2+=serv.co2;
  const comp=new Array(P.species.length).fill(0);let spA=0,suA=0,recBig=0,canopy=0;for(const t of S.trees){if(t.dead)continue;comp[t.sp]++;if(t.origin==='samosiew')spA++;if(t.origin==='odrost')suA++;if((t.origin==='samosiew'||t.origin==='odrost')&&t.H>=4)recBig++;canopy+=Math.PI*t.Reff*t.Reff;}
  // środowisko ważone obecnością ludzi
  let wsum=0,noiseP=0,no2P=0,shadeP=0,glM=0,litM=0,faunaM=0,compM=0,nu=0;for(let i=0;i<T.n;i++){const w=T.target[i];if(w>0&&S.noise){wsum+=w;noiseP+=w*S.noise[i];no2P+=w*S.no2[i];shadeP+=w*(1-(S.ground?S.ground[i]:1));}
    if(SURF[surfKey(T,i)].seal<0.5){glM+=S.ground?S.ground[i]:1;litM+=S.lit[i];faunaM+=S.fauna[i];compM+=S.comp[i];nu++;}}
  const area=T.nx*T.ny*T.res*T.res;
  S.hist.push({y:S.year0+S.year,n,cls,hd:hdN?hdS/hdN:null,zsM,openF:n4z?nOpen/n4z:null,belowF:n4z?nB/n4z:null,hdBelow:nB?hdB/nB:null,hdCanopy:nC?hdC/nC:null,hdOpen:nOpen?hdO/nOpen:null,lai:ladT,cf:n?cfS/n:0,mlow:mlow/n4,alow:alow/n4,wd:n?wd/n:0,inf:n?inf/n:0,dD:nG?dD/nG:null,dH:nG?dH/nG:null,serv,risk,ops:deep(S.ops),rbh:S.ops.rbh,
    def:{l:nl?def.l/nl:0,w:nl?def.w/nl:0,n:nl?def.n/nl:0,x:nl?def.x/nl:0},fails:S.fails||0,ev:(S.events||[]).map(e=>e?e.type:'-').join('/'),cumFail:S.cum.fail,cumRbh:S.cum.rbh,cumRem:S.cum.removed,
    comp,spA,suA,recBig,canopy:canopy/area,noiseP:wsum?noiseP/wsum:null,no2P:wsum?no2P/wsum:null,shadeP:wsum?shadeP/wsum:null,soil:{gl:nu?glM/nu:null,lit:nu?litM/nu:null,fauna:nu?faunaM/nu:null,comp:nu?compM/nu:null},deaths:deep(S.deaths)});
  if(S.hist.length>400)S.hist.shift();}
/* ================= przebiegi, eksperymenty, workery ================= */
// ustawienie = {world:{k:v}, species:{klucz:{k:v}}} ; wartości nadpisują domyślne
function applyOverrides(base,ov){if(!ov)return;if(ov.world)for(const k in ov.world)setK(base.world,k,ov.world[k]);
  if(ov.species)for(const sk in ov.species){const i=spIdxIn(base.species,sk);if(i<0)continue;for(const k in ov.species[sk])setK(base.species[i],k,ov.species[sk][k]);}}
function setParams(...ovs){P={world:deep(WORLD_DEFAULT),species:deep(LIB)};for(const o of ovs)applyOverrides(P,o);}
// wskaźniki końcowe jednego przebiegu (płaska lista, do CSV)
const METRICS=[['n','liczba drzew'],['canopy','pokrycie koron (udział)'],['cf','śr. kondycja korony'],['hd','śr. smukłość H/D (H≥4 m)'],['mlow','udział drzew H≥4 z zapasem pnia <1'],['alow','udział z zapasem zakotwienia <1'],
  ['cumFail','awarie mechaniczne (suma)'],['cumRem','usunięcia (suma)'],['cumRbh','nakład pracy rbh (suma)'],['planted','posadzone (suma)'],['seed','samosiewy (suma)'],['suck','odrosty (suma)'],
  ['servTot','usługi razem (rok)'],['cool','chłodzenie (rok)'],['co2','CO₂ kg (suma)'],['no2P','NO₂ indeks przy ludziach'],['noiseP','hałas dB przy ludziach'],['shadeP','cień przy ludziach'],['risk','ryzyko (suma)'],['recBig','odnowienia H≥4'],['zsM','z* mediana (m)'],['openF','udział drzew otwartych (bez z*)'],['belowF','udział drzew tuż pod z* (do 3 m)'],['hdBelow','H/D tuż pod z*'],['hdCanopy','H/D w okapie (H ≥ z*)'],['hdOpen','H/D drzew otwartych'],['lai','LAI (wskaźnik)']];
function summary(S){const h=S.hist[S.hist.length-1]||{};return {n:h.n,canopy:h.canopy,cf:h.cf,hd:h.hd,mlow:h.mlow,alow:h.alow,cumFail:S.cum.fail,cumRem:S.cum.removed,cumRbh:S.cum.rbh,planted:S.cum.planted,
  seed:S.cum.seed,suck:S.cum.suck,zsM:h.zsM,openF:h.openF,belowF:h.belowF,hdBelow:h.hdBelow,hdCanopy:h.hdCanopy,hdOpen:h.hdOpen,lai:h.lai,servTot:h.serv?h.serv.tot:null,cool:h.serv?h.serv.cool:null,co2:S.cum.co2,no2P:h.no2P,noiseP:h.noiseP,shadeP:h.shadeP,risk:h.risk,recBig:h.recBig};}
const SERIES_KEYS=['n','canopy','cf','hd','zsM','belowF','hdBelow','hdCanopy','lai','mlow','alow','cumFail','cumRbh','risk','noiseP','no2P'];
function seriesOf(S){return S.hist.map(h=>{const o={y:h.y};for(const k of SERIES_KEYS)o[k]=h[k];o.serv=h.serv?h.serv.tot:null;return o;});}
// jeden przebieg: teren, nadpisania (ustawienie Q, eksperyment M), ziarno, lata
function runOne(T,ovs,seed,years,onYear){setParams(...ovs);createSim(T,seed);for(let y=0;y<years;y++){stepYear();if(onYear)onYear(y+1);}return {sum:summary(S),series:seriesOf(S)};}
// plan: {name, years, reps, seed0, settings:[{name,world,species}], experiments:[{name,world,species}]}
function expandPlan(plan){const jobs=[];const Q=plan.settings&&plan.settings.length?plan.settings:[{name:'bazowe'}];const M=plan.experiments&&plan.experiments.length?plan.experiments:[{name:'kontrola'}];
  Q.forEach((q,qi)=>M.forEach((m,mi)=>{for(let r=0;r<Math.max(1,plan.reps|0);r++)jobs.push({qi,mi,r,q:q.name||('Q'+(qi+1)),m:m.name||('M'+(mi+1)),seed:(plan.seed0||1)+r,ovs:[q,m]});}));return jobs;}
// generator czynnikowy: {k:[v1,v2], k2:[...]} -> lista ustawień
function factorial(fac,prefix){const keys=Object.keys(fac);let out=[{}];for(const k of keys){const nx=[];for(const o of out)for(const v of fac[k]){const c=Object.assign({},o);c[k]=v;nx.push(c);}out=nx;}
  return out.map(o=>{const s={name:(prefix||'')+keys.map(k=>k.split('.').pop()+'='+o[k]).join(' '),world:{},species:{}};for(const k in o){if(k.startsWith('species.')){const p=k.split('.');(s.species[p[1]]=s.species[p[1]]||{})[p.slice(2).join('.')]=o[k];}else setK(s.world,k.replace(/^world\./,''),o[k]);}return s;});}
function aggregate(plan,results){const g=new Map();for(const r of results){const k=r.qi+'|'+r.mi;if(!g.has(k))g.set(k,{q:r.q,m:r.m,qi:r.qi,mi:r.mi,runs:[]});g.get(k).runs.push(r.sum);}
  return [...g.values()].sort((a,b)=>a.qi-b.qi||a.mi-b.mi).map(G=>{const o={q:G.q,m:G.m,n:G.runs.length,mean:{},sd:{}};for(const [k] of METRICS){const v=G.runs.map(x=>x[k]).filter(x=>x!=null&&isFinite(x));const mu=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;
    o.mean[k]=mu;o.sd[k]=v.length>1?Math.sqrt(v.reduce((a,b)=>a+(b-mu)*(b-mu),0)/(v.length-1)):0;}return o;});}
// worker: wiadomość {T, jobs, years}; odpowiada {type:'done', job, sum, series} po każdym przebiegu
if(typeof self!=='undefined'&&typeof document==='undefined'&&typeof importScripts==='function'){
  let WT=null;self.onmessage=e=>{const d=e.data;if(d.type==='init'){WT=d.T;return;}if(d.type!=='run')return;for(const j of d.jobs){try{const r=runOne(d.T||WT,j.ovs,j.seed,d.years,y=>{if(y%5===0)self.postMessage({type:'tick',id:j.id,y});});self.postMessage({type:'done',id:j.id,sum:r.sum,series:r.series});}
    catch(err){self.postMessage({type:'err',id:j.id,msg:String(err&&err.stack||err)});}}self.postMessage({type:'idle'});};}

</script>
<script>
/* ================= Okap Teren · interfejs: wspólne ================= */
const VERSION='4.1.0',CODENAME='Brick Betula';
const $=id=>document.getElementById(id);
const h=(tag,attrs,...kids)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!=null&&attrs[k]!==false)e.setAttribute(k,attrs[k]);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;};
const fmt=(v,d=1)=>v==null||!isFinite(v)?'–':Number(v).toLocaleString('pl-PL',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT=0;function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms||2600);}
let CSSV={};
function readCss(){const cs=getComputedStyle(document.documentElement);const out={};for(const n of ['bg','surface','surface-2','ink','ink-soft','line','accent','sky-top','sky-bot','bld','bld-top','crit','warn','good','info','trunk','dead','road','t-zw','t-zs','t-uw','t-us',
  's-trawnik','s-sciolka','s-chodnik','s-laka','s-zadrz','s-rabata','s-klomb','s-grad','s-leg','s-ekoton','w1','w2','w3','w4','w5','w6','card','grid'])out[n]=cs.getPropertyValue('--'+n).trim();CSSV=out;}
const isDark=()=>{const c=hex2rgb(CSSV.bg||'#EDEFEA');return c[0]+c[1]+c[2]<300;};
function hex2rgb(s){s=String(s||'').trim();if(s.startsWith('rgb')){const m=s.match(/[\d.]+/g);return [+m[0],+m[1],+m[2]];}if(s[0]==='#')s=s.slice(1);if(s.length===3)s=s.split('').map(c=>c+c).join('');const v=parseInt(s,16);return [(v>>16)&255,(v>>8)&255,v&255];}

function catClasses(cat){if(cat==='surf')return SURF_CODES.map((c,j)=>({v:j,n:SURF[c].name,col:CSSV[SURF_COL[c]]||'#888'}));return HAB_CODES.map((c,j)=>({v:j,n:HAB[c].name,col:CSSV[HAB_COL[c]]||'#888'}));}

// obiekty punktowe: rój (punkty) albo mapa ciepła (średnia ważona w oknie)

/* ================= widok 2,5D: aksonometria i mapa ================= */
const V={mode:'axo',az:-30,el:38,exag:1.5,k:4,px:0,py:0,W:600,H:400,dpr:1,cx:0,cy:0,z0:0,ground:'surf',
  comp:{relief:true,bld:true,trees:true,labels:false,legend:true},pt:'people',ptMode:'off',sel:null,secA:null};
let cv,ctx,TR,CZ=null,SHADE=null,STR=null,COLRGB=null,colDirty=true,needDraw=false,HEAT=null,SWARM=null,swarmKey='',BLDB=null,LODB=1;
const SEASON_UI=()=>S&&S.lastSeason>=0?S.lastSeason:1;
function requestDraw(){if(needDraw)return;needDraw=true;requestAnimationFrame(()=>{needDraw=false;draw();});}
function markDirty(){colDirty=true;swarmKey='';GLV.dirty=true;requestDraw();}
function setTrig(){const a=V.az*Math.PI/180,e=(V.mode==='map'?90:V.el)*Math.PI/180;TR={ca:Math.cos(a),sa:Math.sin(a),se:Math.sin(e),ce:Math.cos(e)};}
function P3(x,y,z){const dx=x-V.cx,dy=y-V.cy;const u=dx*TR.ca-dy*TR.sa,v=dx*TR.sa+dy*TR.ca;return [V.W/2+V.px+u*V.k,V.H/2+V.py-(v*TR.se+(z-V.z0)*V.exag*TR.ce)*V.k,v];}
function screenToGround(sx,sy){let z=V.z0,x=0,y=0,i=-1;for(let it=0;it<6;it++){const u=(sx-V.W/2-V.px)/V.k,Y=(V.H/2+V.py-sy)/V.k;const v=(Y-(z-V.z0)*V.exag*TR.ce)/TR.se;
    x=V.cx+u*TR.ca+v*TR.sa;y=V.cy-u*TR.sa+v*TR.ca;i=cellOf(T,x,y);if(i<0||TR.ce<1e-6)break;const nz=T.bld[i]>0&&V.comp.bld?T.babs[i]:T.dtm[i];if(Math.abs(nz-z)<0.02)break;z=nz;}return {x,y,i};}
function sizeCanvas(){const r=cv.getBoundingClientRect();V.dpr=Math.min(2,window.devicePixelRatio||1);V.W=Math.max(50,r.width);V.H=Math.max(50,r.height);cv.width=Math.round(V.W*V.dpr);cv.height=Math.round(V.H*V.dpr);}
function terrainPrep(){const {nx,ny,n}=T;V.cx=nx*T.res/2;V.cy=ny*T.res/2;let m=0;for(let i=0;i<n;i++)m+=T.dtm[i];V.z0=m/n;
  CZ=new Float32Array((nx+1)*(ny+1));for(let r=0;r<=ny;r++)for(let c=0;c<=nx;c++){let s=0,k=0;for(const [a,b] of [[r-1,c-1],[r-1,c],[r,c-1],[r,c]]){if(a<0||a>=ny||b<0||b>=nx)continue;s+=T.dtm[a*nx+b];k++;}CZ[r*(nx+1)+c]=s/k;}
  LODB=1;while((nx/LODB)*(ny/LODB)>32000)LODB++;BLDB=null;shadePrep();markDirty();}
function shadePrep(){const n=T.n;SHADE=new Float32Array(n);const zen=45*Math.PI/180,azL=315*Math.PI/180;for(let i=0;i<n;i++){const s=Math.atan(T.slope[i]*V.exag);const hs=Math.cos(zen)*Math.cos(s)+Math.sin(zen)*Math.sin(s)*Math.cos(azL-T.aspect[i]);SHADE[i]=clamp(0.62+0.38*hs/Math.cos(zen),0.5,1.2);}}
// barwy komórek: warstwa podłoża, cieniowanie rzeźby, pora roku, śnieg, mapa ciepła
function rebuildColors(){const n=T.n;COLRGB=COLRGB&&COLRGB.length===n*3?COLRGB:new Uint8ClampedArray(n*3);STR=STR&&STR.length===n?STR:new Array(n);const L=LBYK[V.ground];const si=SEASON_UI();
  let classes=null,lo=0,hi=1;if(L.cat)classes=catClasses(L.cat).map(c=>hex2rgb(c.col));else[lo,hi]=layerRange(L);V.range=[lo,hi];
  const snow=si===3&&S&&S.event&&(S.event.type==='snow'||S.event.type==='winter'||S.event.type==='gale'||S.event.type==='calm');const white=[246,248,250];const bldTop=hex2rgb(CSSV['bld-top']);
  const heat=V.ptMode==='heat'?computeHeat():null;HEAT=heat;
  for(let i=0;i<n;i++){let c;const v=L.val(i);
    if(classes){c=classes[v]||[128,128,128];if(L.cat==='surf'&&si===2&&SURF[surfKey(T,i)].seal<0.5)c=mix(c,[178,140,70],0.18);if(L.cat==='surf'&&si===0&&SURF[surfKey(T,i)].seal<0.5)c=mix(c,[150,205,110],0.12);}
    else c=isFinite(v)?rampRGB(L.ramp,(v-lo)/(hi-lo||1)):[150,150,150];
    if(V.comp.bld&&T.bld[i]>0&&L.k!=='bld')c=mix(bldTop,[40,40,40],clamp(T.bld[i]/60,0,0.4));
    if(snow&&L.cat==='surf'){const sf=SURF[surfKey(T,i)];c=mix(c,white,sf.seal>0.8&&T.traffic[i]>0?0.15:0.62);}
    if(heat&&heat[i]>0.02)c=mix(c,rampRGB('heat',0.15+0.85*heat[i]),Math.min(0.85,0.25+0.6*heat[i]));
    const f=V.comp.relief?SHADE[i]:1;COLRGB[i*3]=c[0]*f;COLRGB[i*3+1]=c[1]*f;COLRGB[i*3+2]=c[2]*f;STR[i]=`rgb(${COLRGB[i*3]},${COLRGB[i*3+1]},${COLRGB[i*3+2]})`;}
  colDirty=false;mapImg=null;GLV.dirty=true;updateLegend();}
// mapa ciepła: średnia ważona w oknie ~6 m (pole) albo gęstość jądrowa (punkty), znormalizowana do 0–1
function boxBlur(a,nx,ny,r){const t=new Float32Array(a.length);for(let y=0;y<ny;y++){let s=0;const o=y*nx;for(let x=-r;x<nx;x++){if(x+r<nx)s+=a[o+x+r];if(x-r-1>=0)s-=a[o+x-r-1];if(x>=0)t[o+x]=s;}}
  const u=new Float32Array(a.length);for(let x=0;x<nx;x++){let s=0;for(let y=-r;y<ny;y++){if(y+r<ny)s+=t[(y+r)*nx+x];if(y-r-1>=0)s-=t[(y-r-1)*nx+x];if(y>=0)u[y*nx+x]=s;}}return u;}
function ptWeights(){const P=PTS[V.pt];const w=new Float32Array(T.n);if(!S)return w;
  if(P.field){for(let i=0;i<T.n;i++)w[i]=P.field(i);}
  else if(P.log){const now=S.year0+S.year;for(const e of S.log){if(!P.log.includes(e.k))continue;const age=now-e.yr;if(age>10)continue;const i=cellOf(T,e.x,e.y);if(i>=0)w[i]+=1-age/11;}}
  else{for(const t of S.trees){if(!t.alive||!P.trees(t))continue;const i=t.ci;if(i>=0)w[i]+=P.w?P.w(t):1;}}return w;}
function computeHeat(){const w=ptWeights();const r=Math.max(1,Math.round(6/T.res));let b=boxBlur(boxBlur(w,T.nx,T.ny,r),T.nx,T.ny,r);let mx=0;for(const v of b)if(v>mx)mx=v;if(mx<=0)return null;for(let i=0;i<b.length;i++)b[i]/=mx;return b;}
function buildSwarm(){const key=V.pt+'|'+(S?S.year+'.'+S.lastSeason:'');if(swarmKey===key&&SWARM)return SWARM;swarmKey=key;const P=PTS[V.pt];const out=[];const rng=mulberry32(97+(S?S.year*7+S.lastSeason:0));
  if(P.field){const w=ptWeights();let sum=0;for(const v of w)sum+=v;const N=Math.round(clamp(sum*T.res*T.res/40,30,1500));const cum=new Float32Array(T.n);let s=0;for(let i=0;i<T.n;i++){s+=w[i];cum[i]=s;}
    for(let k=0;k<N&&s>0;k++){const q=rng()*s;let lo=0,hi=T.n-1;while(lo<hi){const m=(lo+hi)>>1;if(cum[m]<q)lo=m+1;else hi=m;}const [x,y]=cellXY(T,lo);out.push({x:x+(rng()-0.5)*T.res,y:y+(rng()-0.5)*T.res,a:1});}}
  else if(P.log){const now=S.year0+S.year;for(const e of S.log){if(!P.log.includes(e.k))continue;const age=now-e.yr;if(age>10)continue;out.push({x:e.x+(rng()-0.5)*0.8,y:e.y+(rng()-0.5)*0.8,a:1-age/11,k:e.k});}}
  else for(const t of S.trees){if(t.alive&&P.trees(t))out.push({x:t.x,y:t.y,a:1});}
  SWARM=out;return out;}
const PT_COL={people:'w4',fails:'crit',removed:'ink-soft',regen:'good',rot:'warn',risk:'crit'};

/* ---------- rysowanie ---------- */
let mapImg=null;
function skyColors(){const si=SEASON_UI();const dark=isDark();const base=dark?[['#16232B','#121A16'],['#14222C','#121815'],['#211D18','#15130F'],['#1A1E23','#121416']]:[['#CFE3EC','#EEF3EA'],['#BCD9EA','#F1F3EA'],['#DCD3C2','#F2EEE4'],['#CDD3DA','#EEF0F2']];
  const b=clamp(SUN_EL[si]/60,0.35,1);const c=base[si].map(hex2rgb).map(c=>dark?c:mix([120,128,136],c,0.55+0.45*b));return c.map(x=>rgbs(x));}
function draw(){if(!ctx)return;setTrig();const d=V.dpr;ctx.setTransform(d,0,0,d,0,0);
  let vox=V.mode==='vox';if(vox&&!glInit()){V.mode='axo';vox=false;document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.m==='axo'));toast('Widok wokselowy wymaga WebGL2, którego ta przeglądarka nie udostępnia.',4000);}
  $('gl').style.display=vox?'block':'none';
  if(vox)ctx.clearRect(0,0,V.W,V.H);else{if(V.mode==='axo'){const sc=skyColors();const g=ctx.createLinearGradient(0,0,0,V.H);g.addColorStop(0,sc[0]);g.addColorStop(1,sc[1]);ctx.fillStyle=g;}else ctx.fillStyle=CSSV['surface-2'];ctx.fillRect(0,0,V.W,V.H);}
  if(!T)return;if(colDirty||!STR)rebuildColors();
  if(vox)glRender();else if(V.mode==='map')drawGroundMap();else drawGroundAxo();
  drawSectionLine();if(V.ptMode==='swarm')drawSwarm();drawObjects();drawHUD();}
function drawGroundMap(){const {nx,ny,res}=T;if(!mapImg){mapImg=document.createElement('canvas');mapImg.width=nx;mapImg.height=ny;const c2=mapImg.getContext('2d');const id=c2.createImageData(nx,ny);for(let i=0;i<T.n;i++){id.data[i*4]=COLRGB[i*3];id.data[i*4+1]=COLRGB[i*3+1];id.data[i*4+2]=COLRGB[i*3+2];id.data[i*4+3]=255;}c2.putImageData(id,0,0);}
  const k=V.k,ca=TR.ca,sa=TR.sa;const ex=V.W/2+V.px+k*(-ca*V.cx-sa*(ny*res-V.cy)),ey=V.H/2+V.py-k*(-sa*V.cx+ca*(ny*res-V.cy));const d=V.dpr;
  ctx.save();ctx.setTransform(d*k*res*ca,-d*k*res*sa,d*k*res*sa,d*k*res*ca,d*ex,d*ey);ctx.imageSmoothingEnabled=false;ctx.drawImage(mapImg,0,0);ctx.restore();}
function drawGroundAxo(){const {nx,ny}=T;const B=LODB;const W1=nx+1;const rows=[],cols=[];for(let r=0;r<ny;r+=B)rows.push(r);for(let c=0;c<nx;c+=B)cols.push(c);
  if(TR.ca<0)rows.reverse();if(TR.sa>0)cols.reverse();ctx.lineWidth=0.8;ctx.lineJoin='round';
  for(const r of rows){const r2=Math.min(ny,r+B);for(const c of cols){const c2=Math.min(nx,c+B);const i=Math.min(ny-1,r+(B>>1))*nx+Math.min(nx-1,c+(B>>1));
    const x0=c*T.res,x1=c2*T.res,y0=(ny-r)*T.res,y1=(ny-r2)*T.res;const a=P3(x0,y0,CZ[r*W1+c]),b=P3(x1,y0,CZ[r*W1+c2]),e=P3(x1,y1,CZ[r2*W1+c2]),f=P3(x0,y1,CZ[r2*W1+c]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(e[0],e[1]);ctx.lineTo(f[0],f[1]);ctx.closePath();ctx.fillStyle=STR[i];ctx.fill();ctx.strokeStyle=STR[i];ctx.stroke();}}}
function bldBlocks(){if(BLDB)return BLDB;const {nx,ny}=T,B=LODB;const out=[];for(let r=0;r<ny;r+=B)for(let c=0;c<nx;c+=B){let hmax=0,cnt=0;for(let a=r;a<Math.min(ny,r+B);a++)for(let b=c;b<Math.min(nx,c+B);b++){const i=a*nx+b;if(T.bld[i]>0){cnt++;if(T.babs[i]>hmax||!hmax)hmax=T.babs[i];}}
    if(cnt*2>=B*B||(B===1&&cnt)){const x0=c*T.res,x1=Math.min(nx,c+B)*T.res,y0=(ny-r)*T.res,y1=(ny-Math.min(ny,r+B))*T.res;const zg=T.dtm[Math.min(ny-1,r+(B>>1))*nx+Math.min(nx-1,c+(B>>1))];out.push({r,c,x0,x1,y0,y1,z:hmax,zg,x:(x0+x1)/2,y:(y0+y1)/2});}}
  const key=new Map(out.map(o=>[o.r+','+o.c,o]));for(const o of out){o.nE=key.get(o.r+','+(o.c+B));o.nW=key.get(o.r+','+(o.c-B));o.nN=key.get((o.r-B)+','+o.c);o.nS=key.get((o.r+B)+','+o.c);}BLDB=out;return out;}
function drawObjects(){const items=[];const axo=V.mode!=='map';const vox=V.mode==='vox';

const parseVal=v=>{const s=String(v).trim();if(s==='')return s;try{return JSON.parse(s);}catch(e){}const n=Number(s.replace(',','.'));return isFinite(n)?n:s;};
// ustawienia z JSON albo CSV -> {world, species} (nadpisania na wartości domyślne)
function parseSettings(text,name){text=text.replace(/^﻿/,'');if(/\.json$/i.test(name)||text.trim().startsWith('{')){const o=JSON.parse(text);return {world:o.world||{},species:o.species||{}};}
  const C=splitCSV(text);const out={world:{},species:{}};const hi=C.head.map(x=>x.toLowerCase());const iz=hi.indexOf('zakres'),ik=hi.indexOf('klucz'),iv=hi.indexOf('wartosc')>=0?hi.indexOf('wartosc'):hi.indexOf('wartość');if(iz<0||ik<0||iv<0)throw new Error('CSV ustawień musi mieć kolumny: zakres; klucz; wartosc.');
  for(const r of C.rows){const z=r[iz],k=r[ik],v=parseVal(r[iv]);if(!k)continue;if(z==='world')setK(out.world,k,v);else if(z.startsWith('species:')){const sk=z.slice(8);(out.species[sk]=out.species[sk]||{});setK(out.species[sk],k,v);}}return out;}

function glRender(){const gl=GLV.gl,c=$('gl');const d=V.dpr;const w=Math.round(V.W*d),hh=Math.round(V.H*d);if(c.width!==w||c.height!==hh){c.width=w;c.height=hh;}

function chartCtx(cv){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(10,Math.round(r.width*d));cv.height=Math.max(10,Math.round(r.height*d));const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return [c,r.width,r.height];}
const FONT=()=>getComputedStyle(document.body).fontFamily;
function axes(c,W,H,x0,x1,y0,y1,m){c.strokeStyle=CSSV.line;c.fillStyle=CSSV['ink-soft'];c.lineWidth=1;c.font='11px '+FONT();const sx=x=>m.l+(x-x0)/(x1-x0||1)*(W-m.l-m.r),sy=y=>H-m.b-(y-y0)/(y1-y0||1)*(H-m.t-m.b);
  const ys=niceStep((y1-y0)/4);c.textAlign='right';c.textBaseline='middle';for(let y=Math.ceil(y0/ys)*ys;y<=y1+1e-9;y+=ys){c.globalAlpha=0.6;c.beginPath();c.moveTo(m.l,sy(y));c.lineTo(W-m.r,sy(y));c.stroke();c.globalAlpha=1;c.fillText(fmt(y,ys<1?(ys<0.1?2:1):0),m.l-4,sy(y));}
  const xs=m.int?Math.max(1,niceStep((x1-x0)/4)):niceStep((x1-x0)/4);c.textAlign='center';c.textBaseline='top';for(let x=Math.ceil(x0/xs)*xs;x<=x1+1e-9;x+=xs)c.fillText(String(Math.round(x*100)/100),sx(x),H-m.b+3);return [sx,sy];}
function lineChart(cv,series,opt){opt=opt||{};const [c,W,H]=chartCtx(cv);c.clearRect(0,0,W,H);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const s of series){for(const [x,y] of s.pts){if(y==null||!isFinite(y))continue;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}for(const b of s.band||[]){if(isFinite(b[1]))y0=Math.min(y0,b[1]);if(isFinite(b[2]))y1=Math.max(y1,b[2]);}}
  if(x0>x1){c.fillStyle=CSSV['ink-soft'];c.font='12px '+FONT();c.fillText('brak danych',10,20);return;}if(opt.zero!==false&&y0>0&&y0<(y1-y0)*0.6)y0=0;if(y1-y0<1e-9){y1+=1;y0-=opt.zero===false?1:0;}const pad=(y1-y0)*0.06;y1+=pad;if(y0!==0)y0-=pad;if(x1===x0)x1=x0+1;
  const leg=opt.legend&&series.length>1;const m={int:true,l:40,r:16,t:leg?6+14*Math.ceil(series.length/2):6,b:18};const [sx,sy]=axes(c,W,H,x0,x1,y0,y1,m);
  for(const s of series){if(s.band){c.fillStyle=rgbs(hex2rgb(s.col),0.14);c.beginPath();let st=false;s.band.forEach(b=>{if(!isFinite(b[1]))return;if(!st){c.moveTo(sx(b[0]),sy(b[2]));st=true;}else c.lineTo(sx(b[0]),sy(b[2]));});for(let i=s.band.length-1;i>=0;i--){const b=s.band[i];if(isFinite(b[1]))c.lineTo(sx(b[0]),sy(b[1]));}c.closePath();c.fill();}
    c.strokeStyle=s.col;c.lineWidth=s.w||2;c.setLineDash(s.dash||[]);c.beginPath();let st=false;for(const [x,y] of s.pts){if(y==null||!isFinite(y)){st=false;continue;}if(st)c.lineTo(sx(x),sy(y));else{c.moveTo(sx(x),sy(y));st=true;}}c.stroke();c.setLineDash([]);}
  if(leg){c.font='11px '+FONT();c.textAlign='left';c.textBaseline='middle';series.forEach((s,i)=>{const x=m.l+(i%2)*(W-m.l)/2,y=8+14*Math.floor(i/2);c.fillStyle=s.col;c.fillRect(x,y-2,12,4);c.fillStyle=CSSV.ink;c.fillText(s.name.length>34?s.name.slice(0,33)+'…':s.name,x+16,y);});}
  else if(series.length>1||series[0]&&series[0].name){c.font='11px '+FONT();c.textAlign='right';c.textBaseline='top';let x=W-m.r;for(let i=series.length-1;i>=0;i--){const s=series[i];if(!s.name)continue;const w=c.measureText(s.name).width;c.fillStyle=CSSV.ink;c.fillText(s.name,x,2);c.fillStyle=s.col;c.fillRect(x-w-14,7,10,3);x-=w+22;}}}
function barChart(cv,items){const [c,W,H]=chartCtx(cv);c.clearRect(0,0,W,H);if(!items.length)return;let y1=0,y0=0;for(const it of items){y1=Math.max(y1,(it.v||0)+(it.sd||0));y0=Math.min(y0,(it.v||0)-(it.sd||0));}if(y1===y0)y1=1;
  const m={l:40,r:8,t:6,b:Math.min(130,14+4.6*Math.min(28,Math.max(...items.map(i=>i.name.length))))};const [,sy]=axes(c,W,H,0,1,y0,y1*1.05,m);c.clearRect(m.l,H-m.b+1,W,m.b);const bw=(W-m.l-m.r)/items.length;
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*0.15,w=bw*0.7;c.fillStyle=it.col;c.fillRect(x,sy(Math.max(0,it.v||0)),w,Math.abs(sy(it.v||0)-sy(0)));c.strokeStyle=CSSV.ink;c.lineWidth=1.2;const xc=x+w/2;c.beginPath();c.moveTo(xc,sy((it.v||0)-(it.sd||0)));c.lineTo(xc,sy((it.v||0)+(it.sd||0)));c.moveTo(xc-4,sy((it.v||0)+(it.sd||0)));c.lineTo(xc+4,sy((it.v||0)+(it.sd||0)));c.moveTo(xc-4,sy((it.v||0)-(it.sd||0)));c.lineTo(xc+4,sy((it.v||0)-(it.sd||0)));c.stroke();
    c.save();c.translate(xc,H-m.b+4);c.rotate(-Math.PI/4);c.fillStyle=CSSV['ink-soft'];c.font='10.5px '+FONT();c.textAlign='right';c.textBaseline='middle';c.fillText(it.name.length>28?it.name.slice(0,27)+'…':it.name,0,0);c.restore();});}
function scatterChart(cv,pts,opt){const [c,W,H]=chartCtx(cv);c.clearRect(0,0,W,H);if(!pts.length){c.fillStyle=CSSV['ink-soft'];c.font='12px '+FONT();c.fillText('brak drzew ≥ 4 m'+(opt.vline!=null?' w zwarciu':''),10,20);return;}let x0=0,x1=0,y1=0;for(const p of pts){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}if(x1<=x0)x1=x0+1;
  const m={l:40,r:8,t:6,b:30};const pad=(x1-x0)*0.05;const [sx,sy]=axes(c,W,H,x0<0?x0-pad:0,x1+pad,0,y1*1.08,m);if(opt.vline!=null){c.strokeStyle=CSSV.accent;c.setLineDash([4,3]);c.beginPath();c.moveTo(sx(opt.vline),m.t);c.lineTo(sx(opt.vline),H-m.b);c.stroke();c.setLineDash([]);}c.fillStyle=CSSV['ink-soft'];c.textAlign='center';c.textBaseline='bottom';c.fillText(opt.xl,W/2,H-1);
  for(const p of pts){c.fillStyle=rgbs(p.c,0.8);c.beginPath();c.arc(sx(p.x),sy(p.y),p.sel?4.5:2.6,0,6.283);c.fill();if(p.sel){c.strokeStyle=CSSV.accent;c.lineWidth=2;c.stroke();}}}

// profil pionowy: gęstość ulistnienia (oś dolna) i pokrycie (0–1, oś górna) względem wysokości nad gruntem
function profileChart(cv,vp,zs){const [c,W,H]=chartCtx(cv);c.clearRect(0,0,W,H);const nk=vp.lad.length;if(!nk){c.fillStyle=CSSV['ink-soft'];c.font='12px '+FONT();c.fillText('brak koron',10,20);return;}
  const m={l:40,r:12,t:16,b:30};const zmax=nk*vp.dz;let lmax=0;for(const v of vp.lad)lmax=Math.max(lmax,v);lmax=lmax||1;const sx=v=>m.l+v/lmax*(W-m.l-m.r),sc=v=>m.l+v*(W-m.l-m.r),sy=z=>H-m.b-z/zmax*(H-m.t-m.b);
  c.strokeStyle=CSSV.line;c.fillStyle=CSSV['ink-soft'];c.font='11px '+FONT();c.textAlign='right';c.textBaseline='middle';const st=niceStep(zmax/5);for(let z=0;z<=zmax;z+=st){c.globalAlpha=0.6;c.beginPath();c.moveTo(m.l,sy(z));c.lineTo(W-m.r,sy(z));c.stroke();c.globalAlpha=1;c.fillText(fmt(z,0)+' m',m.l-4,sy(z));}
  c.fillStyle=rgbs(hex2rgb(CSSV.w3),0.45);for(let k=0;k<nk;k++){c.fillRect(m.l,sy((k+1)*vp.dz),sx(vp.lad[k])-m.l,sy(k*vp.dz)-sy((k+1)*vp.dz)-0.5);}
  c.strokeStyle=CSSV.w1;c.lineWidth=2;c.beginPath();for(let k=0;k<nk;k++){const y=sy((k+0.5)*vp.dz);if(k)c.lineTo(sc(vp.cov[k]),y);else c.moveTo(sc(vp.cov[k]),y);}c.stroke();
  if(zs!=null&&isFinite(zs)&&zs<zmax){c.strokeStyle=CSSV.accent;c.setLineDash([5,3]);c.beginPath();c.moveTo(m.l,sy(zs));c.lineTo(W-m.r,sy(zs));c.stroke();c.setLineDash([]);c.fillStyle=CSSV.accent;c.textAlign='right';c.textBaseline='bottom';c.fillText('z* (mediana) '+fmt(zs,1)+' m',W-m.r,sy(zs)-2);}
  c.fillStyle=CSSV['ink-soft'];c.textAlign='left';c.textBaseline='bottom';c.font='10.5px '+FONT();c.fillText('słupki: ulistnienie (maks. '+fmt(lmax,2)+' m²/m³) · linia: pokrycie 0–1',m.l,H-2);}

function drawStar(cv,t){if(!cv||!t.cr)return;if(cv.getBoundingClientRect().width<40)return;const [c,W,H]=chartCtx(cv);c.clearRect(0,0,W,H);let mx=0;for(const r of t.cr)mx=Math.max(mx,r);const sc=(Math.min(W,H)/2-14)/Math.max(mx,0.5);const cx=W/2,cy=H/2;
  c.strokeStyle=CSSV.line;c.lineWidth=1;c.beginPath();c.moveTo(cx,6);c.lineTo(cx,H-6);c.moveTo(6,cy);c.lineTo(W-6,cy);c.stroke();const m=t.cr.reduce((a,b)=>a+b,0)/8;c.setLineDash([3,3]);c.beginPath();c.arc(cx,cy,m*sc,0,6.283);c.stroke();c.setLineDash([]);
  const col=hex2rgb(P.species[t.sp].color);c.fillStyle=rgbs(col,0.45);c.strokeStyle=rgbs(col.map(v=>v*0.6));c.lineWidth=1.5;c.beginPath();for(let k=0;k<=8;k++){const q=k%8;const x=cx+SEC_DX[q]*t.cr[q]*sc,y=cy-SEC_DY[q]*t.cr[q]*sc;if(k)c.lineTo(x,y);else c.moveTo(x,y);}c.closePath();c.fill();c.stroke();
  c.fillStyle=CSSV.trunk;c.beginPath();c.arc(cx,cy,3,0,6.283);c.fill();c.fillStyle=CSSV.ink;c.font='700 10px sans-serif';c.textAlign='center';c.fillText('N',cx,10);}

    else{T[BR.attr][i]=BR.val;if(BR.attr==='traffic')BR.traffic=true;}ch=true;}if(ch){BR.dirty=true;markDirty();}}

/* ================= zasady ================= */
function buildRules(){$('rulesDoc').innerHTML=`
<h3>Co nowego w ${VERSION} „${CODENAME}”</h3>
<p>Układ jest teraz mieszany. Grunt (nawierzchnia, runo, gleba, ściółka, hałas, ludzie) zostaje na siatce 2,5D, a przestrzeń nad gruntem to okap z wokseli: sześcianów o boku równym komórce i wysokości 1 m (2 m przy siatce 5 m). Każdy woksel ma tłumienie światła i dominującą koronę.</p>
<ul><li><b>Widok „Woksele”</b> pokazuje teren, budynki, pnie i liście jako bloki (WebGL2), w tej samej aksonometrii co widok 2D. Zimą liście znikają i zostaje szkielet gałęzi.</li>
<li><b>Plastyczne korony.</b> Korona ma 8 promieni sektorów (N, NE … NW). Co roku sektory wydłużają się w stronę światła i wolnej przestrzeni, skracają przy budynkach i wyższych sąsiadach, a w głębokim cieniu zamierają. Środek korony przesuwa się w stronę luki. Średnia szerokość korony nadal wynika z inwestycji w koronę.</li>
<li><b>Światło przez woksele.</b> Promienie (zenit, 8 kierunków nieba, słońce) przechodzą przez kolejne woksele i są tłumione według sumy tłumienia, bez korony własnej. Światło korony to środek i 8 punktów sektorów.</li>
<li><b>z* według PPA.</b> Dla każdego drzewa i dla rastra (co ok. 5 m) liczona jest wysokość, przy której suma powierzchni koron drzew wyższych w kole o promieniu ${P.world.zR} m wypełnia koło. Gdy się nie da, drzewo jest „otwarte”. Wskaźniki: mediana z*, udział drzew tuż pod z* (do 3 m) i ich H/D oraz H/D w okapie i drzew otwartych (hipotezy H4 i H8).</li>
<li><b>Profil pionowy okapu</b> (gęstość ulistnienia i pokrycie na kolejnych poziomach) jest na wykresie i w eksporcie. Eksport ZIP ma katalog <code>woksele/</code> z rastrem na każdy poziom; osobno są CSV wokseli i CSV profilu.</li>
<li><b>Przekroje</b> pokazują woksele koron w pasie (profil) i w płaszczyźnie (pionowy), a przekrój poziomy to wycinek wokseli na zadanej wysokości.</li></ul>
<p><b>Uwaga interpretacyjna.</b> Związek smukłości z położeniem względem z* jest w grze wbudowany w reguły alokacji (gra o wysokość), więc jego pojawienie się w wynikach nie jest dowodem empirycznym. Gra pozwala sprawdzić, jakie wzorce dają przyjęte reguły i jak porównywać je z danymi, np. z woksalizacją ALS.</p>
<h3>Wersja 4.0 „Terrace Tilia”</h3>
<p>Okap Teren to osobne narzędzie obok Okapu Miasto 3.4. Plansza nie jest już przekrojem ulicy, tylko siatką komórek 2,5D: każda komórka ma wysokość terenu, nawierzchnię i runo, siedlisko, ruch, strefę użytkowania i budynek. Drzewa stoją w punktach (x, y) i rywalizują o światło w trzech wymiarach.</p>
<ul><li><b>Widok aksonometryczny i mapa.</b> Obracaj (⟲ ⟳), zmieniaj nachylenie i przewyższenie, przybliżaj kółkiem albo przyciskami, przesuwaj przeciągając.</li>
<li><b>Warstwy do wyboru.</b> Jedna warstwa barwi podłoże (płaty, siedlisko, NMT, nNMPT, wilgotność, runo, ściółka, fauna, ugniecenie, światło przy ziemi, hałas, NO₂, sól, ludzie, ruch, budynki); budynki, drzewa i etykiety gatunków włączasz osobno.</li>
<li><b>Obiekty punktowe</b> (ludzie, awarie, usunięcia, odnowienia, zgnilizna, ryzyko) jako rój punktów albo mapa ciepła (średnia ważona w oknie ok. 6 m).</li>
<li><b>Przekroje:</b> profil 1,5D wzdłuż linii A–B (rzeźba, budynki, drzewa w pasie i wartości warstwy), przekrój pionowy 2D z polem światła oraz przekrój poziomy 2D na wybranej wysokości nad gruntem.</li>
<li><b>Dane:</b> import NMT, NMPT i warstw ASC, drzew z CSV (albo wykrycie budynków i drzew z NMPT); eksport warstw ASC w ZIP, komórek, drzew, szeregu czasowego i dziennika zdarzeń do CSV, ustawień do JSON i CSV.</li>
<li><b>Hałas → zanieczyszczenie:</b> mapa hałasu drogowego liczona z natężenia ruchu i jego propagacji, z ekranowaniem przez budynki i teren, tłumieniem przez niską roślinność i pochłanianiem nad miękkim gruntem. Wskaźnik NO₂ rośnie z hałasem.</li>
<li><b>Eksperymenty wsadowe:</b> N powtórzeń × M eksperymentów × Q ustawień, liczone równolegle w tle; wyniki jako średnia ± SD, wykresy, CSV i JSON, zapis planów i wyników.</li></ul>
<h3>Jak to liczy</h3>
<ul><li><b>Światło.</b> Korony wypełniają woksele według promieni sektorów i profilu pionowego (najszersze na 40% głębokości od podstawy). Tłumienie w wokselu zależy od przepuszczalności gatunku, kondycji korony, ulistnienia w danej porze i jej głębokości. Promienie z zenitu, ośmiu kierunków nieba rozproszonego i słońca (SE, S, SW, wysokość zależna od pory roku) sumują tłumienie wokseli cudzych koron; budynki i teren zasłaniają.</li>
<li><b>Konkurencja.</b> Nakładające się korony dzielą obszar według siły inwestycji w koronę (konkurs Tullocka); niższa traci więcej. „Sygnał konkurencji” to udział światła odebranego przez korony wyżej. Uruchamia on grę o wysokość: przesunięcie alokacji z grubości na wysokość, czyli wzrost smukłości H/D.</li>
<li><b>Wiatr.</b> Ekspozycja wynika z róży wiatrów i osłony z każdego kierunku do odległości 2H. Zapas pnia to D/D wymagane, a zapas zakotwienia to nośność korzeni do obciążenia przy wietrze odniesienia. Burze sprawdzają oba.</li>
<li><b>Gleba i woda.</b> Drzewa dzielą objętość gleby w kole korzeni proporcjonalnie do potrzeb; uszczelnienie ją ogranicza. Wilgotność zależy od siedliska, wskaźnika TWI (spływ po NMT) i nasłonecznienia stoku.</li>
<li><b>Hałas.</b> Źródła to komórki jezdni o mocy zależnej od natężenia ruchu. Poziom w odbiorniku to suma energii ze źródeł do 220 m, z rozbieżnością geometryczną, ekranem (budynek albo teren na linii), tłumieniem przez korony poniżej 4 m i gruntem miękkim. NO₂ = ((L − próg) / (pełne − próg))^1,2, obcięte do 0–1. Można wczytać własną mapę hałasu zamiast modelu.</li>
<li><b>Ludzie.</b> Obecność to strefa użytkowania, zwiększona w cieniu i zmniejszona przy hałasie powyżej 65 dB. Waży ona ryzyko drzew i wskaźniki narażenia.</li></ul>
<h3>Formaty danych</h3>
<ul><li><b>ASC:</b> nagłówek ncols, nrows, xllcorner/xllcenter, yllcorner/yllcenter, cellsize, NODATA_value; pierwszy wiersz to północ. Wszystkie pliki muszą być w jednym układzie (zakładany EPSG:2180).</li>
<li><b>Kody:</b> nawierzchnia i runo ${SURF_CODES.map((c,i)=>i+' '+c).join(', ')}; siedlisko ${HAB_CODES.map((c,i)=>i+' '+c).join(', ')}; ruch i strefa użytkowania 0–3; solenie 0/1.</li>
<li><b>Drzewa CSV:</b> x, y, gatunek, wysokość, pierśnica albo obwód, promień, średnica albo powierzchnia korony, id. Separator jest rozpoznawany samodzielnie.</li>
<li><b>Ustawienia:</b> JSON <code>{world:{…}, species:{tcor:{…}}}</code> albo CSV <code>zakres;klucz;wartosc</code>.</li>
<li><b>Plan eksperymentu:</b> JSON z polami name, years, reps, seed0, settings, experiments albo CSV <code>typ;nazwa;klucz;wartosc</code> (typ: plan, ustawienie, eksperyment).</li>
<li><b>Linia zestawu w planie:</b> <code>nazwa | inspect=1; windBase.gale=3; species.tcor.sigma=0.8</code>.</li></ul>
<h3>Granice tej wersji</h3>
<p>Wszystkie parametry są robocze i nieskalibrowane, z rozkładami niepewności, jak w wersji 3. Wyniki służą do porównywania wariantów między sobą, nie do prognoz dla konkretnych drzew. Przekrojowe wzorce z gry (np. H/D a konkurencja) nie są testem dynamiki.</p>
<p>W wersjach 4.x nie ma jeszcze gildii grzybów poza zgnilizną pnia, symbiontów, kwitnienia i owocowania, zwierząt, odczuć ludzi, wypadków i kampanii z Okapu Miasto 3.4. Trafią do wersji 4.2. Wczytywanie chmur punktów (LAS) i porównanie z woksalizacją ALS to kolejny krok.</p>`;}

/* ================= pętla gry i start ================= */
let PLAY=false,playT=0;const SPEEDS={wolno:900,'zwykle':300,szybko:0};let SPEED='zwykle';
function afterStep(full){markDirty();updateCards();if(full||S.season===0){updateCharts();treeCard();}if(SEC.show&&S.season===0)drawSection();}
function doSeason(){stepSeason();afterStep(false);}
function doYear(){do{stepSeason();}while(S.season!==0);afterStep(true);}
function playLoop(){if(!PLAY)return;doSeason();playT=setTimeout(playLoop,SPEEDS[SPEED]);}
function setPlay(on){PLAY=on;$('bPlay').textContent=on?'❚❚ Pauza':'▶ Graj';$('bPlay').classList.toggle('pri',!on);clearTimeout(playT);if(on)playLoop();}
function startTerrain(Tn){setPlay(false);const seed=+$('seed').value||7;createSim(Tn,seed);T=S.T;V.sel=null;SEC.a=SEC.b=null;closeSection();terrainPrep();sizeCanvas();fitView();markDirty();updateCards();updateCharts();treeCard();terrInfo();
  $('terrName').textContent=T.name+' · '+T.nx+' × '+T.ny+' po '+T.res+' m';planInfo&&$('xInfo')&&planInfo();}
function showTab(k){document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.p===k));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+k));if(k==='ind')requestAnimationFrame(updateCharts);if(k==='tree')requestAnimationFrame(()=>{const t=S&&S.trees.find(x=>x.id===V.sel);if(t)drawStar($('tcStar'),t);});if(k==='exp')requestAnimationFrame(()=>{planInfo();if(EXP.results.length)showResults();});}
function buildLayerPanel(){const g=$('lyrGround');g.innerHTML='';for(const L of LAYERS){if(L.k==='bld')continue;g.append(h('label',{class:'lyr'},h('input',{type:'radio',name:'gl',value:L.k,checked:L.k===V.ground,onchange:()=>{V.ground=L.k;markDirty();if(SEC.show)drawSection();}}),L.n,L.u?h('span',{class:'u'},L.u):null));}
  const c=$('lyrComp');c.innerHTML='';for(const [k,n] of [['relief','cieniowanie rzeźby'],['bld','budynki'],['trees','drzewa'],['labels','skróty gatunków'],['legend','legenda']])c.append(h('label',{class:'lyr'},h('input',{type:'checkbox',checked:V.comp[k],onchange:e=>{V.comp[k]=e.target.checked;markDirty();}}),n));
  const ps=$('ptSet');ps.innerHTML='';for(const k in PTS)ps.append(h('option',{value:k,selected:k===V.pt},PTS[k].n));ps.onchange=()=>{V.pt=ps.value;markDirty();};
  document.querySelectorAll('#ptMode button').forEach(b=>b.onclick=()=>{V.ptMode=b.dataset.p;document.querySelectorAll('#ptMode button').forEach(x=>x.classList.toggle('on',x===b));markDirty();});}
function init(){readCss();if(window.innerWidth<640)V.comp.legend=false;$('verChip').textContent=VERSION+' · '+CODENAME;cv=$('cv');ctx=cv.getContext('2d');scv=$('secCv');sctx=scv.getContext('2d');
  const sp=h('select',{id:'speed',title:'Tempo gry',onchange:e=>{SPEED=e.target.value;}},...Object.keys(SPEEDS).map(k=>h('option',{value:k,selected:k===SPEED},k)));$('bPlay').after(sp);
  $('bPlay').onclick=()=>setPlay(!PLAY);$('bSeason').onclick=()=>{setPlay(false);doSeason();if(S.season===0)afterStep(true);};$('bYear').onclick=()=>{setPlay(false);doYear();};$('bReset').onclick=()=>{startTerrain(T);toast('Nowa gra na tym terenie.');};
  document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{V.mode=b.dataset.m;document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b));fitView();});
  $('rotL').onclick=()=>{V.az-=15;fitView();};$('rotR').onclick=()=>{V.az+=15;fitView();};$('tilt').oninput=e=>{V.el=+e.target.value;requestDraw();};$('exag').onchange=e=>{V.exag=+e.target.value;shadePrep();markDirty();};
  $('zIn').onclick=()=>zoomAt(1.3,V.W/2,V.H/2);$('zOut').onclick=()=>zoomAt(1/1.3,V.W/2,V.H/2);$('zFit').onclick=fitView;
  document.querySelectorAll('#toolSeg button').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
  document.querySelectorAll('#tabbar button').forEach(b=>b.onclick=()=>showTab(b.dataset.p));
  document.querySelectorAll('#secSeg button').forEach(b=>b.onclick=()=>openSection(b.dataset.s));$('secClose').onclick=closeSection;
  $('secBand').oninput=e=>{SEC.band=clamp(+e.target.value||4,0.5,30);drawSection();requestDraw();};$('secZ').oninput=e=>{SEC.z=+e.target.value;$('secZv').textContent=fmt(SEC.z,1)+' m';clearTimeout(SEC._t);SEC._t=setTimeout(drawSection,60);};
  $('secCsv').onclick=()=>{const s=sectionCSV();if(s)saveFile('przekroj_'+SEC.mode+'_'+stamp()+'.csv',s);};
  buildLayerPanel();buildCharts();buildRules();buildParams();buildDataPanel();buildExpPanel();initPointer();setTool('pick');
  let fitted=false;new ResizeObserver(()=>{sizeCanvas();if(!fitted&&T){fitted=true;fitView();}requestDraw();if(SEC.show)drawSection();}).observe($('vbox'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readCss();markDirty();updateCharts();});
  sizeCanvas();startTerrain(demoTerrain(1,1));}
init();

</script>
